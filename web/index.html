<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模型健康监控</title>
    <script>
      // Pre-paint theme resolver. Mirrors useTheme()'s readInitialTheme() so
      // the first paint already has the right `dark` class on <html> — no
      // flash of wrong theme (FOWT) on reload. Keep this in sync with
      // web/src/hooks/use-theme.ts:readInitialTheme.
      (function () {
        try {
          var v = localStorage.getItem("perf-dashboard.theme");
          if (v !== "dark" && v !== "light") v = "dark";
          if (v === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = v;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <script>
      // GitHub Pages SPA fallback handler. When 404.html redirects here with
      // ?/<path> in the query, restore the original path via history API.
      // (pathSegmentsToKeep = 1 because the app lives at /perf-dashboard/)
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          var newPath =
            l.pathname
              .split("/")
              .slice(0, 1 + pathSegmentsToKeep)
              .join("/") +
            "/" +
            decoded.replace(/^\//, "") +
            l.hash;
          window.history.replaceState(null, "", newPath);
        }
      })();
    </script>
  </head>
  <body class="min-h-svh bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
