name: Build & Push perf-dashboard to DockerHub
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_push_image:
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: haibinchen
      IMAGE_NAME: perf-dashboard
      IMAGE_TAG: latest
      # 强制走 BuildKit, Dockerfile 第一行 # syntax=docker/dockerfile:1.7
      # 需要 BuildKit 才能识别
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout project source code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER }}

      # 用 build-push-action 跑 build, 自动把每层日志展开到 GitHub UI
      # (直接 docker build 出错的话 GitHub UI 不显示具体 step 错误)
      - name: Build & push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          provenance: false
