name: Build & Push perf-dashboard to DockerHub
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_push_image:
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: haibinchen
      IMAGE_NAME: perf-dashboard
      IMAGE_TAG: latest
    steps:
      - name: Checkout project source code
        uses: actions/checkout@v4

      # 官方标准登录DockerHub，直接读取你现有的 DOCKER 密钥
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER }}

      # 构建镜像（多阶段 Dockerfile: bun build → go embed → distroless）
      - name: Build Docker Image
        run: docker build -t ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      # 推送镜像至DockerHub
      - name: Push Docker Image
        run: docker push ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
