name: Build & Push perf-dashboard to DockerHub
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_push_image:
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: haibinchen
      IMAGE_NAME: perf-dashboard
      IMAGE_TAG: latest
      # 强制走 BuildKit, Dockerfile 第一行 # syntax=docker/dockerfile:1.7
      # 需要 BuildKit 才能识别
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout project source code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER }}

      # 多阶段 Dockerfile: bun build → go embed → distroless
      # --progress=plain 把 stderr 完整打到日志, 失败时能直接看到具体哪一步出错
      - name: Build Docker Image
        run: docker build --progress=plain -t ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: docker push ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
